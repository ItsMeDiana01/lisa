<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Augmented Reality - Bangun Ruang SD</title>

    <!-- Tailwind CSS untuk styling modern dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Inter untuk tipografi yang bersih -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Mengatur font global dan warna latar belakang */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Mengatur tampilan model-viewer secara khusus */
        model-viewer {
            width: 100%;
            height: 60vh;
            --poster-color: #f3f4f6;
            transition: opacity 0.5s ease-in-out;
            display: none; /* Awalnya disembunyikan sampai tombol Tampilkan ditekan */
            background-color: #ffffff;
        }
        /* Menyesuaikan tampilan tombol AR */
        .ar-button {
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 9999px;
            padding: 0.75rem 2rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .ar-button:hover {
            background-color: #333333;
            transform: translateX(-50%) scale(1.05);
        }
        /* Gaya untuk tombol model */
        .model-button {
            background-color: #e5e7eb;
            color: #374151;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .model-button:hover {
            background-color: #d1d5db;
        }
        .model-button.active {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        /* Area Preview Image */
        #flashcard-preview-container {
            display: none;
            max-width: 300px;
            margin: 0 auto;
        }
    </style>

    <!-- Mengimpor komponen model-viewer.js yang diperlukan -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen text-gray-800">

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden max-w-4xl w-full">
            <div class="p-8 md:p-12">
                <h1 id="model-title" class="text-3xl md:text-4xl font-bold text-center mb-2 text-gray-900 uppercase tracking-tight">Media Belajar Bangun Ruang AR</h1>
                <p id="model-subtitle" class="text-center text-gray-500 mb-8 font-medium">Langkah 1: Pilih Bangun Ruang</p>

                <!-- BAGIAN 1: PEMILIHAN MODEL -->
                <div class="mb-10">
                    <h2 class="text-sm font-bold text-center text-gray-400 uppercase mb-4 tracking-widest">Pilih Bangun Ruang</h2>
                    <div id="model-buttons-container" class="flex flex-wrap justify-center gap-3">
                        <!-- Tombol-tombol akan dibuat secara dinamis oleh JavaScript -->
                    </div>
                </div>

                <!-- BAGIAN 2: AUTOMATIC PREVIEW FLASHCARD -->
                <div class="bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl p-6 mb-8 text-center">
                    <h2 class="font-bold text-blue-700 mb-4 uppercase text-sm tracking-widest">Langkah 2: Scan Flashcard</h2>
                    
                    <div id="flashcard-preview-container">
                        <p class="text-xs text-blue-400 mb-2 font-bold">Flashcard Terdeteksi:</p>
                        <!-- Gambar akan berubah otomatis lewat JS -->
                        <img id="flashcard-preview-img" src="" alt="Preview" class="rounded-lg shadow-md border-4 border-white mx-auto max-h-48">
                    </div>
                    
                    <div id="no-selection-msg" class="text-blue-400 italic text-sm">
                        Silakan pilih bangun ruang di atas untuk melihat flashcard.
                    </div>
                </div>

                <!-- BAGIAN 3: TOMBOL TRIGGER & VIEWER -->
                <div id="action-container" class="text-center mb-8">
                    <button id="btn-show-3d" class="bg-green-600 hover:bg-green-700 text-white px-10 py-4 rounded-2xl font-black text-lg transition-all shadow-lg uppercase tracking-wider transform active:scale-95">
                        Munculkan Model 3D
                    </button>
                </div>

                <!-- Model Viewer utama dengan Fitur AR AKTIF -->
                <div class="relative">
                    <model-viewer
                        id="ar-model-viewer"
                        src="kubus.glb"
                        ios-src="kubus.usdz"
                        alt="Model 3D Bangun Ruang"
                        shadow-intensity="1"
                        camera-controls
                        auto-rotate
                        ar
                        ar-modes="webxr scene-viewer quick-look"
                        class="rounded-2xl border border-gray-200 shadow-inner"
                    >
                        <!-- Tombol AR -->
                        <button slot="ar-button" class="ar-button">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                            MASUK KE MODE AR
                        </button>
                    </model-viewer>
                </div>

            </div>
            
            <div class="bg-gray-50 p-6 text-center text-sm text-gray-500 border-t border-gray-200">
                <p class="mb-1 font-semibold">Klik tombol hitam di dalam gambar untuk melihat model di duniamu!</p>
                <p class="font-bold text-gray-400">Media Pembelajaran Augmented Reality</p>
            </div>
        </div>
    </div>

    <script>
        /**
         * CATATAN: Ubah 'img_src' di bawah ini sesuai dengan nama file gambar 
         * yang ada di laptop Anda. Pastikan filenya satu folder dengan HTML ini.
         */
        const models = [
            { name: 'Kubus', glb_src: 'glb1/kubus.glb', usdz_src: 'kubus.usdz', img_src: 'marker/kubus.png' },
            { name: 'Balok', glb_src: 'glb1/balok.glb', usdz_src: 'balok.usdz', img_src: 'marker/balok.png' },
            { name: 'Prisma', glb_src: 'glb1/prisma.glb', usdz_src: 'prisma.usdz', img_src: 'marker/prisma.png' },
            { name: 'Limas', glb_src: 'glb1/limas.glb', usdz_src: 'limas.usdz', img_src: 'marker/limas.png' },
            { name: 'Tabung', glb_src: 'glb1/tabung.glb', usdz_src: 'tabung.usdz', img_src: 'marker/tabung.png' },
            { name: 'Kerucut', glb_src: 'glb1/kerucut.glb', usdz_src: 'kerucut.usdz', img_src: 'marker/kerucut.png' },
            { name: 'Bola', glb_src: 'glb1/bola.glb', usdz_src: 'bola.usdz', img_src: 'marker/bola.png' },
        ];

        const modelViewer = document.getElementById('ar-model-viewer');
        const buttonContainer = document.getElementById('model-buttons-container');
        const modelTitle = document.getElementById('model-title');
        const modelSubtitle = document.getElementById('model-subtitle');
        
        const previewContainer = document.getElementById('flashcard-preview-container');
        const previewImg = document.getElementById('flashcard-preview-img');
        const noSelectionMsg = document.getElementById('no-selection-msg');
        const btnShow3d = document.getElementById('btn-show-3d');

        let selectedModel = null;

        // 1. Tombol "Munculkan Model 3D"
        btnShow3d.addEventListener('click', function() {
            if (!selectedModel) {
                alert("Silakan pilih bangun ruang terlebih dahulu!");
                return;
            }
            // Munculkan viewer
            modelViewer.style.display = 'block';
            // Panggil mekanisme switch original
            switchModel(selectedModel);
            // Scroll otomatis ke model
            modelViewer.scrollIntoView({ behavior: 'smooth' });
        });

        // MEKANISME PROGRAM ORIGINAL
        function switchModel(model) {
            modelViewer.style.opacity = '0';

            setTimeout(() => {
                modelViewer.src = model.glb_src;
                modelViewer.iosSrc = model.usdz_src;
                modelViewer.alt = `Model 3D ${model.name}`;
                modelTitle.textContent = `Bangun Ruang: ${model.name}`;
                modelSubtitle.textContent = `Pilih "MASUK KE MODE AR" untuk memproyeksikan benda ini ke duniamu.`;

                modelViewer.style.opacity = '1';

                const buttons = buttonContainer.querySelectorAll('.model-button');
                buttons.forEach(button => {
                    button.classList.remove('active');
                    if (button.textContent === model.name) {
                        button.classList.add('active');
                    }
                });
            }, 500);
        }

        // Fungsi membuat tombol original dengan penambahan link gambar
        function createModelButtons() {
            models.forEach((model, index) => {
                const button = document.createElement('button');
                button.textContent = model.name;
                button.className = 'model-button';

                button.addEventListener('click', () => {
                    selectedModel = model;
                    
                    // Update tampilan tombol aktif
                    const buttons = buttonContainer.querySelectorAll('.model-button');
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // UPDATE GAMBAR OTOMATIS BERDASARKAN HREF/LINK
                    previewImg.src = model.img_src; 
                    previewContainer.style.display = 'block';
                    noSelectionMsg.style.display = 'none';

                    // Reset alur: Sembunyikan viewer agar siswa harus menekan tombol "Munculkan"
                    modelViewer.style.display = 'none';
                    modelTitle.textContent = "AYO BELAJAR BANGUN RUANG!";
                    modelSubtitle.textContent = `Flashcard ${model.name} terdeteksi. Silakan klik tombol di bawah.`;
                });
                buttonContainer.appendChild(button);
            });
        }

        // Memuat tombol saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            createModelButtons();
        });
    </script>

</body>
</html>
</html>
